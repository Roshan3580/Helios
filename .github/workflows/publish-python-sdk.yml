name: Publish Python SDK

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-python-sdk-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package-version: ${{ steps.release-tag.outputs.version }}
    steps:
      - name: Validate release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^python-sdk-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must match python-sdk-v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"

      - name: Check out the released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require released code to be merged into the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"; then
            echo "The released commit is not merged into ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Require tag and package metadata versions to match
        env:
          EXPECTED_VERSION: ${{ steps.release-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("sdk/python/pyproject.toml").read_text())["project"]["version"])')"
          if [[ "${PACKAGE_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo "Package version ${PACKAGE_VERSION} does not match release version ${EXPECTED_VERSION}." >&2
            exit 1
          fi

      - name: Fail if the version already exists on PyPI
        env:
          EXPECTED_VERSION: ${{ steps.release-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output "${RUNNER_TEMP}/pypi-version.json" --write-out '%{http_code}' \
            "https://pypi.org/pypi/helios-observatory-sdk/${EXPECTED_VERSION}/json")"
          case "${STATUS}" in
            404) ;;
            200)
              echo "helios-observatory-sdk ${EXPECTED_VERSION} already exists on PyPI." >&2
              exit 1
              ;;
            *)
              echo "PyPI version check returned unexpected HTTP ${STATUS}." >&2
              exit 1
              ;;
          esac

      - name: Install test and release dependencies
        working-directory: sdk/python
        run: python -m pip install -e ".[dev]"

      - name: Run canonical Python SDK tests
        working-directory: sdk/python
        run: python -m pytest -v

      - name: Build and validate release distributions
        env:
          PYTHON_BIN: python
          EXPECTED_VERSION: ${{ steps.release-tag.outputs.version }}
        run: bash scripts/build-python-sdk-release.sh

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdk-${{ steps.release-tag.outputs.version }}
          path: |
            sdk/python/dist/helios_observatory_sdk-${{ steps.release-tag.outputs.version }}-py3-none-any.whl
            sdk/python/dist/helios_observatory_sdk-${{ steps.release-tag.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/helios-observatory-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-sdk-${{ needs.verify.outputs.package-version }}
          path: dist

      - name: Require exactly the verified wheel and sdist
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.package-version }}
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="dist/helios_observatory_sdk-${EXPECTED_VERSION}-py3-none-any.whl"
          SDIST="dist/helios_observatory_sdk-${EXPECTED_VERSION}.tar.gz"
          test -f "${WHEEL}"
          test -f "${SDIST}"
          test "$(find dist -type f | wc -l | tr -d ' ')" = "2"

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          attestations: true
